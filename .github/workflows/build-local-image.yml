name: Build Overleaf AI Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare .dockerignore for root build context
        run: cp server-ce/.dockerignore .dockerignore

      - name: Build and push Overleaf CE + AI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-ce/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            OVERLEAF_BASE_TAG=sharelatex/sharelatex-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
